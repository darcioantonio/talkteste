services:
  # Backend Service (serves both API and frontend static files)
  - type: web
    name: talk-chat-server
    env: node
    buildCommand: npm install --prefix client && npm run build --prefix client && npm install --prefix server
    startCommand: npm start --prefix server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
    healthCheckPath: /api/health

